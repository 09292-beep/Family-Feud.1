name: Build Family Feud APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o FamilyFeudAndroid_Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/FamilyFeudAndroid_New assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyFeud-APK
          path: extracted/FamilyFeudAndroid_New/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
